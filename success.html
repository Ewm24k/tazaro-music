<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Payment Successful | Tazaro Music Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background-color: var(--bg-primary);
        }
        .success-card {
            background: linear-gradient(180deg, #131924 0%, #0A0E14 100%);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: var(--radius-lg);
            padding: 2.5rem 2rem;
            max-width: 540px;
            width: 100%;
            text-align: center;
            box-shadow: 0 32px 72px rgba(0, 0, 0, 0.8);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            align-items: center;
        }
        .success-icon {
            width: 68px;
            height: 68px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-emerald);
            border: 1px solid rgba(16, 185, 129, 0.35);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
        .success-card h1 {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            color: #fff;
        }
        .success-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .download-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: var(--radius-md);
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .file-pill {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.35);
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            color: #E2E8F0;
        }
        .file-pill span strong {
            color: var(--accent-gold-light);
        }
        .btn-download-all {
            width: 100%;
            background: var(--accent-gold);
            color: #07090B;
            border: none;
            padding: 1rem;
            border-radius: var(--radius-md);
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-download-all:hover {
            background: var(--accent-gold-light);
        }
        .btn-home {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }
        .btn-home:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="success-icon" id="statusIcon">✓</div>
        <h1 id="statusTitle">Payment Verified</h1>
        <p id="statusDesc">Thank you for your acquisition. Your complete concert package is ready for download.</p>

        <div class="download-box" id="downloadBox">
            <div class="file-pill">
                <span>✓ Print-Ready Score</span>
                <strong>.PDF</strong>
            </div>
            <div class="file-pill">
                <span>✓ Compressed MusicXML</span>
                <strong>.MXL</strong>
            </div>
            <div class="file-pill">
                <span>✓ Master Timeline Track</span>
                <strong>.MID</strong>
            </div>
        </div>

        <button class="btn-download-all" id="downloadBtn">Download Complete Package (.ZIP)</button>
        <a href="/" class="btn-home">← Back to Catalog</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const sessionId = params.get('session_id');
        const songSlug = params.get('song');
        const edition = params.get('edition') || 'piano';

        const statusIcon = document.getElementById('statusIcon');
        const statusTitle = document.getElementById('statusTitle');
        const statusDesc = document.getElementById('statusDesc');
        const downloadBtn = document.getElementById('downloadBtn');
        const downloadBox = document.getElementById('downloadBox');

        if (!songSlug) {
            statusIcon.textContent = '✕';
            statusIcon.style.color = '#EF4444';
            statusIcon.style.borderColor = '#EF4444';
            statusTitle.textContent = 'Order Not Found';
            statusDesc.textContent = 'No active order detected. Please return to the catalog and select a score.';
            downloadBtn.style.display = 'none';
            downloadBox.style.display = 'none';
        } else {
            async function downloadAllFiles() {
                downloadBtn.disabled = true;
                downloadBtn.textContent = 'Packaging files, please wait...';

                try {
                    const zip = new JSZip();
                    const mainFolder = zip.folder(`Tazaro-${songSlug}-${edition}`);

                    // Handle 'both' bundle vs solo instrument
                    let fileList = [];
                    if (edition === 'both') {
                        fileList.push(
                            { path: `sheet/piano/${songSlug}.pdf`, name: `piano/${songSlug}-piano.pdf` },
                            { path: `sheet/piano/${songSlug}.mxl`, name: `piano/${songSlug}-piano.mxl` },
                            { path: `sheet/piano/${songSlug}.mid`, name: `piano/${songSlug}-piano.mid` },
                            { path: `sheet/guitar/${songSlug}.pdf`, name: `guitar/${songSlug}-guitar.pdf` },
                            { path: `sheet/guitar/${songSlug}.mxl`, name: `guitar/${songSlug}-guitar.mxl` },
                            { path: `sheet/guitar/${songSlug}.mid`, name: `guitar/${songSlug}-guitar.mid` }
                        );
                    } else {
                        fileList.push(
                            { path: `sheet/${edition}/${songSlug}.pdf`, name: `${songSlug}-score.pdf` },
                            { path: `sheet/${edition}/${songSlug}.mxl`, name: `${songSlug}-score.mxl` },
                            { path: `sheet/${edition}/${songSlug}.mid`, name: `${songSlug}-sequence.mid` }
                        );
                    }

                    for (const item of fileList) {
                        try {
                            const res = await fetch(item.path);
                            if (res.ok) {
                                const blob = await res.blob();
                                mainFolder.file(item.name, blob);
                            }
                        } catch (e) {
                            console.warn('File packaging skip:', item.path);
                        }
                    }

                    mainFolder.file("LICENSE.txt", 
                        `TAZARO MUSIC SHEET — VERIFIED REPERTOIRE ARCHIVE\n` +
                        `Song: ${songSlug}\n` +
                        `Edition: ${edition.toUpperCase()}\n` +
                        `Rights: Full arrangement, modification, and commercial reseller rights granted.\n`
                    );

                    const zipBlob = await zip.generateAsync({ type: "blob" });
                    const downloadUrl = URL.createObjectURL(zipBlob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `Tazaro-${songSlug}-${edition}-complete.zip`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(downloadUrl);

                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Download Again (.ZIP)';
                } catch (err) {
                    downloadBtn.disabled = false;
                    downloadBtn.textContent = 'Download Complete Package (.ZIP)';
                    alert('Download error: ' + err.message);
                }
            }

            downloadBtn.addEventListener('click', downloadAllFiles);

            window.addEventListener('DOMContentLoaded', () => {
                setTimeout(downloadAllFiles, 1000);
            });
        }
    </script>
</body>
</html>
